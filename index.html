
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>MultiChain Wallet</title>

<style>
body {
  margin: 0;
  padding: 18px;
  background: #111827;
  color: white;
  font-family: -apple-system, sans-serif;
}
h2 { text-align: center; }
.card {
  background: #1f2937;
  padding: 16px;
  border-radius: 14px;
  margin: 14px 0;
}
button {
  width: 100%;
  padding: 15px;
  margin: 7px 0;
  border: 0;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 16px;
}
.address {
  direction: ltr;
  text-align: left;
  word-break: break-all;
  color: #93c5fd;
  font-size: 13px;
}
.label { color: #9ca3af; font-size: 13px; }
#phrase {
  direction: ltr;
  text-align: left;
  line-height: 2;
  word-break: break-word;
  color: #fbbf24;
}
#status { color: #93c5fd; text-align: center; }
.warning { color: #fca5a5; font-size: 12px; }
</style>
</head>

<body>

<h2>MultiChain Wallet</h2>

<div class="card">
  <button id="generate">تولید کیف پول جدید</button>
  <p id="status">آماده تولید کیف پول</p>
</div>

<div class="card">
  <h3>عبارت بازیابی BIP39</h3>
  <div id="phrase">هنوز تولید نشده است</div>
  <button id="copyPhrase">کپی عبارت بازیابی</button>
</div>

<div class="card">
  <h3>آدرس‌های دریافت</h3>
  <div id="addresses">هنوز آدرسی تولید نشده است</div>
  <button id="copyAddresses">کپی همه آدرس‌ها</button>
</div>

<div class="card">
  <p class="warning">
    این نسخه اولیه است و هنوز ممیزی امنیتی نشده.
    از آن برای نگهداری سرمایه واقعی استفاده نکن.
    عبارت بازیابی را با هیچ‌کس به اشتراک نگذار.
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js"></script>

<script>
"use strict";

const PATH = "m/44'/60'/0'/0/0";

const networks = [
  "Ethereum",
  "BNB Smart Chain",
  "Polygon",
  "Arbitrum",
  "Optimism",
  "Avalanche C-Chain"
];

let currentPhrase = "";
let currentAddresses = {};

const statusBox = document.getElementById("status");
const phraseBox = document.getElementById("phrase");
const addressesBox = document.getElementById("addresses");

document.getElementById("generate").addEventListener("click", async () => {
  try {
    statusBox.textContent = "در حال تولید کیف پول...";

    if (!window.crypto ||
        typeof window.crypto.getRandomValues !== "function") {
      throw new Error("مولد تصادفی امن در دسترس نیست.");
    }

    if (!window.ethers ||
        !window.ethers.HDNodeWallet) {
      throw new Error("کتابخانه ethers بارگذاری نشده است.");
    }

    // Create a genuine BIP39 12-word wallet.
    // Ethers uses a cryptographically secure random source.
    const rootWallet = ethers.HDNodeWallet.createRandom();

    if (!rootWallet.mnemonic) {
      throw new Error("عبارت بازیابی تولید نشد.");
    }

    const phrase = rootWallet.mnemonic.phrase;

    // Derive the account using the standard EVM path.
    const wallet = ethers.HDNodeWallet.fromPhrase(
      phrase,
      "",
      PATH
    );

    currentPhrase = phrase;
    currentAddresses = {};

    phraseBox.textContent = phrase;

    networks.forEach(network => {
      currentAddresses[network] = wallet.address;
    });

    addressesBox.innerHTML = "";

    networks.forEach(network => {
      const item = document.createElement("div");
      item.className = "card";

      const title = document.createElement("strong");
      title.textContent = network;

      const path = document.createElement("div");
      path.className = "label";
      path.textContent = PATH;

      const address = document.createElement("div");
      address.className = "address";
      address.textContent = wallet.address;

      item.appendChild(title);
      item.appendChild(path);
      item.appendChild(address);

      addressesBox.appendChild(item);
    });

    statusBox.textContent =
      "کیف پول تولید شد. آدرس EVM استخراج شد.";

  } catch (error) {
    currentPhrase = "";
    currentAddresses = {};

    phraseBox.textContent = "تولید ناموفق";
    addressesBox.textContent = "آدرسی تولید نشد.";

    statusBox.textContent =
      "خطا: " + error.message;
  }
});

document.getElementById("copyPhrase").addEventListener(
  "click",
  async () => {
    if (!currentPhrase) {
      statusBox.textContent = "ابتدا کیف پول تولید کن.";
      return;
    }

    try {
      await navigator.clipboard.writeText(currentPhrase);
      statusBox.textContent = "عبارت کپی شد.";
    } catch (error) {
      statusBox.textContent =
        "کپی خودکار ممکن نشد؛ عبارت را دستی انتخاب کن.";
    }
  }
);

document.getElementById("copyAddresses").addEventListener(
  "click",
  async () => {
    if (!Object.keys(currentAddresses).length) {
      statusBox.textContent = "ابتدا کیف پول تولید کن.";
      return;
    }

    const text = Object.entries(currentAddresses)
      .map(([name, address]) => name + "\n" + address)
      .join("\n\n");

    try {
      await navigator.clipboard.writeText(text);
      statusBox.textContent = "آدرس‌ها کپی شدند.";
    } catch (error) {
      statusBox.textContent = "کپی آدرس‌ها ناموفق بود.";
    }
  }
);
</script>

</body>
</html>
